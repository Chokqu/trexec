name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        go: [ '1.26.x' ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Run Tests (Unix with Race Detector)
        if: runner.os != 'Windows'
        run: go test -v -race -count=1 -timeout=120s ./...

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: go test -v -count=1 -timeout=120s ./...

      - name: Build Examples
        run: |
          go build -o bin/example_basic ./examples/basic
          go build -o bin/example_devserver ./examples/devserver
          go build -o bin/example_supervisor ./examples/supervisor
